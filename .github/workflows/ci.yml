name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile source
        run: |
          python -m py_compile main.py config/*.py downloader/*.py player/*.py ui/*.py utils/*.py

      - name: Run pytest
        run: |
          pytest

      - name: UI smoke test
        run: |
          xvfb-run -a python - <<'PY'
          from ui.app import YuoopApp

          app = YuoopApp()
          app.update_idletasks()
          app.update()
          assert app.download_btn_header.cget("state") == "disabled"
          app.download_manager.stop()
          app.destroy()
          PY

      - name: Validate PyInstaller args
        run: |
          python build_exe.py --dry-run
