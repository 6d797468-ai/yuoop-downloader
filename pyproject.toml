[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuoop-downloader"
version = "1.2.0"
description = "A polished desktop application for analyzing and downloading YouTube playlists, videos, mixes, and channels."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yuoop Contributors" }
]
keywords = ["youtube", "downloader", "yt-dlp", "customtkinter", "desktop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "customtkinter==5.2.2",
  "yt-dlp==2026.3.17",
  "Pillow>=10.4.0,<13",
  "requests==2.33.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "build>=1.2,<2",
]
package = [
  "PyInstaller==6.20.0",
]

[project.scripts]
yuoop = "main:main"

[tool.setuptools]
packages = ["assets", "config", "downloader", "player", "ui", "utils"]
py-modules = ["main", "TROUBLESHOOTING"]
include-package-data = true

[tool.setuptools.package-data]
assets = ["*.ico", "*.png"]
config = ["default_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
